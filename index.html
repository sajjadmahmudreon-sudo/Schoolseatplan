function toBengaliDigits(val) {
  const map = { '0': '০', '1': '১', '2': '২', '3': '৩', '4': '৪', '5': '৫', '6': '৬', '7': '৭', '8': '৮', '9': '৯' };
  return String(val).replace(/[0-9]/g, (d) => map[d]);
}
function fmtNum(val, lang) { return lang === 'bn' ? toBengaliDigits(val) : String(val); }

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function seatLabel(idx, totalSeats, lang) {
  const bn = lang === 'bn';
  if (totalSeats === 1) return bn ? 'একক' : 'Single';
  if (totalSeats === 2) return idx === 0 ? (bn ? 'বাম' : 'Left') : (bn ? 'ডান' : 'Right');
  if (idx === 0) return bn ? 'বাম' : 'Left';
  if (idx === 1) return bn ? 'মাঝে' : 'Mid';
  return bn ? 'ডান' : 'Right';
}

function allocateSeats(selectedStudents, hallsConfig, pattern) {
  const isRollMix = pattern === 'z_mix' || pattern === 'l_mix';
  const isLStyle = pattern === 'l_serial' || pattern === 'l_mix';

  const byClass = {};
  selectedStudents.forEach((s) => {
    const c = Number(s.class);
    if (!byClass[c]) byClass[c] = [];
    byClass[c].push({ ...s });
  });
  const allSelectedClassKeys = Object.keys(byClass).map(Number).sort((a, b) => a - b);
  allSelectedClassKeys.forEach((c) => {
    byClass[c] = isRollMix ? shuffleArray(byClass[c]) : byClass[c].sort((a, b) => Number(a.roll) - Number(b.roll));
  });
  const queues = {};
  allSelectedClassKeys.forEach((c) => { queues[c] = [...byClass[c]]; });

  const popFromClass = (c) => {
    const clsNum = Number(c);
    if (queues[clsNum] && queues[clsNum].length > 0) return queues[clsNum].shift();
    return null;
  };

  const popFromList = (list, preferDifferentClass = null) => {
    if (!Array.isArray(list) || list.length === 0) return null;
    if (preferDifferentClass !== null) {
      for (const c of list) {
        if (Number(c) !== Number(preferDifferentClass) && queues[c]?.length > 0) {
          return queues[c].shift();
        }
      }
    }
    for (const c of list) {
      if (queues[c]?.length > 0) return queues[c].shift();
    }
    return null;
  };

  const allocations = [];
  const hallSummaries = [];
  const allocatedIds = new Set();

  hallsConfig.forEach((hall, hIdx) => {
    const hallId = hall.id || `hall-${hIdx + 1}`;
    const hallNumber = String(hall.hall_number || `Hall ${hIdx + 1}`).trim();
    const totalRows = 1;
    const seatsPerBench = Math.min(3, Math.max(1, Number(hall.seats_per_bench) || 2));
    const colCount = Math.max(1, Number(hall.column_count) || 2);
    const colBenches = [];
    for (let c = 0; c < colCount; c++) {
      const rawVal = Array.isArray(hall.column_benches) ? hall.column_benches[c] : 5;
      colBenches.push(Math.max(1, Number(rawVal) || 1));
    }

    const assignedClasses = (Array.isArray(hall.assigned_classes) && hall.assigned_classes.length > 0)
      ? hall.assigned_classes.map(Number).filter((c) => allSelectedClassKeys.includes(c))
      : allSelectedClassKeys;

    const fallbackClasses = (Array.isArray(hall.fallback_classes) && hall.fallback_classes.length > 0)
      ? hall.fallback_classes.map(Number).filter((c) => allSelectedClassKeys.includes(c) && !assignedClasses.includes(c))
      : allSelectedClassKeys.filter((c) => !assignedClasses.includes(c));

    const cornerClasses = assignedClasses.length > 0 ? assignedClasses : allSelectedClassKeys;
    const orderedMiddleClasses = Array.isArray(hall.middle_classes) && hall.middle_classes.length > 0
      ? hall.middle_classes.map(Number)
      : [
          ...(hall.middle_class ? [Number(hall.middle_class)] : []),
          ...(hall.middle_fallback_class ? [Number(hall.middle_fallback_class)] : [])
        ];
    const middleClass = orderedMiddleClasses[0] || null;
    const middleFallbackClass = orderedMiddleClasses[1] || null;

    let hallAllocatedCount = 0, hallCapacity = 0, benchCounter = 0;
    colBenches.forEach((bc) => { hallCapacity += totalRows * bc * seatsPerBench; });
    const maxBenches = Math.max(...colBenches);

    let rrCornerIdx = 0;

    for (let bInCol = 1; bInCol <= maxBenches; bInCol++) {
      for (let colIdx = 0; colIdx < colCount; colIdx++) {
        const rowNum = 1;
        const primaryClass = cornerClasses[colIdx % cornerClasses.length];
        const secondaryClass = cornerClasses[(colIdx + 1) % cornerClasses.length];

        if (bInCol <= colBenches[colIdx]) {
          benchCounter += 1;
          let prevCls = null;

          for (let seatIdx = 0; seatIdx < seatsPerBench; seatIdx++) {
            let student = null;
            const isMiddleSeat = seatsPerBench === 3 && seatIdx === 1;

            const pickWithNoAdjacentClass = (primaryCandidate, secondaryCandidate) => {
              if (primaryCandidate && Number(primaryCandidate) !== Number(prevCls)) {
                const s = popFromClass(primaryCandidate);
                if (s) return s;
              }
              if (secondaryCandidate && Number(secondaryCandidate) !== Number(prevCls)) {
                const s = popFromClass(secondaryCandidate);
                if (s) return s;
              }
              const sCornerDiff = popFromList(cornerClasses, prevCls);
              if (sCornerDiff) return sCornerDiff;
              const sFallbackDiff = popFromList(fallbackClasses, prevCls);
              if (sFallbackDiff) return sFallbackDiff;

              if (primaryCandidate) {
                const s = popFromClass(primaryCandidate);
                if (s) return s;
              }
              return popFromList(cornerClasses, null) || popFromList(fallbackClasses, null);
            };

            if (isMiddleSeat && orderedMiddleClasses.length > 0) {
              for (const mc of orderedMiddleClasses) {
                if (Number(mc) !== Number(prevCls)) {
                  const s = popFromClass(mc);
                  if (s) { student = s; break; }
                }
              }
              if (!student) {
                for (const mc of orderedMiddleClasses) {
                  const s = popFromClass(mc);
                  if (s) { student = s; break; }
                }
              }
              if (!student) {
                student = popFromList(cornerClasses, prevCls) || popFromList(fallbackClasses, prevCls);
              }
              if (!student) {
                student = popFromList(cornerClasses, null) || popFromList(fallbackClasses, null);
              }
            } else if (isLStyle) {
              if (seatsPerBench === 1) {
                student = pickWithNoAdjacentClass(primaryClass, secondaryClass);
              } else if (seatsPerBench === 2) {
                student = seatIdx === 0
                  ? pickWithNoAdjacentClass(primaryClass, secondaryClass)
                  : pickWithNoAdjacentClass(secondaryClass, primaryClass);
              } else {
                if (seatIdx === 0) {
                  student = pickWithNoAdjacentClass(primaryClass, secondaryClass);
                } else if (seatIdx === 1) {
                  student = popFromList(cornerClasses, prevCls) || popFromList(fallbackClasses, prevCls) || popFromList(cornerClasses, null) || popFromList(fallbackClasses, null);
                } else {
                  student = pickWithNoAdjacentClass(secondaryClass, primaryClass);
                }
              }
            } else {
              const cornerPool = cornerClasses;
              const n = cornerPool.length;
              if (seatsPerBench === 1) {
                student = popFromList(cornerPool, prevCls) || popFromList(fallbackClasses, prevCls) || popFromList(cornerPool, null) || popFromList(fallbackClasses, null);
              } else if (seatsPerBench === 3 && orderedMiddleClasses.length > 0) {
                const wantedCorner = n ? cornerPool[(bInCol - 1 + (seatIdx === 2 ? 1 : 0) + rrCornerIdx) % n] : null;
                const otherCorner = n ? cornerPool[(bInCol - 1 + (seatIdx === 2 ? 0 : 1) + rrCornerIdx) % n] : null;
                student = pickWithNoAdjacentClass(wantedCorner, otherCorner);
                if (student) rrCornerIdx += 1;
              } else {
                const wanted = n ? cornerPool[((bInCol - 1) + seatIdx) % n] : null;
                const alt = n ? cornerPool[((bInCol - 1) + seatIdx + 1) % n] : null;
                student = pickWithNoAdjacentClass(wanted, alt);
              }
            }

            if (student) prevCls = Number(student.class);

            if (student && !allocatedIds.has(student.id)) {
              allocatedIds.add(student.id);
              hallAllocatedCount += 1;
              allocations.push({
                id: `${hallId}-c${colIdx + 1}-r${rowNum}-b${bInCol}-s${seatIdx + 1}`,
                hall_id: hallId,
                hall_number: hallNumber,
                column_number: colIdx + 1,
                row_number: rowNum,
                bench_number: bInCol,
                overall_bench_number: benchCounter,
                seat_index: seatIdx + 1,
                seats_per_bench: seatsPerBench,
                student_id: student.id,
                student_name_snapshot: student.name,
                student_roll_snapshot: Number(student.roll),
                student_class_snapshot: Number(student.class)
              });
            }
          }
        }
      }
    }

    const hallAllocForSummary = allocations.filter((a) => a.hall_number === hallNumber);
    const classBreakdown = {};
    hallAllocForSummary.forEach((a) => {
      const c = Number(a.student_class_snapshot);
      classBreakdown[c] = (classBreakdown[c] || 0) + 1;
    });

    hallSummaries.push({
      id: hallId,
      hall_number: hallNumber,
      total_rows: totalRows,
      column_count: colCount,
      column_benches: colBenches,
      seats_per_bench: seatsPerBench,
      assigned_classes: assignedClasses,
      fallback_classes: fallbackClasses,
      middle_classes: orderedMiddleClasses,
      middle_class: middleClass,
      middle_fallback_class: middleFallbackClass,
      class_breakdown: classBreakdown,
      capacity: hallCapacity,
      allocated_count: hallAllocatedCount
    });
  });

  const unallocated = [];
  allSelectedClassKeys.forEach((c) => queues[c].forEach((s) => { if (!allocatedIds.has(s.id)) unallocated.push(s); }));
  const hallOrder = {};
  hallSummaries.forEach((h, i) => { hallOrder[h.hall_number] = i; });
  allocations.sort((x, y) =>
    (hallOrder[x.hall_number] - hallOrder[y.hall_number]) || (x.column_number - y.column_number) ||
    (x.bench_number - y.bench_number) || (x.seat_index - y.seat_index));
  return { allocations, hallSummaries, unallocated };
}

function formatHallClassBreakdown(hallAlloc, lang, isBn) {
  const counts = {};
  hallAlloc.forEach((a) => {
    const c = Number(a.student_class_snapshot);
    counts[c] = (counts[c] || 0) + 1;
  });
  const keys = Object.keys(counts).map(Number).sort((a, b) => a - b);
  return keys.map((c) => `${isBn ? 'ক্লাস' : 'Class'} ${fmtNum(c, lang)} = ${fmtNum(counts[c], lang)}`);
}

function buildLayoutSections({ hallSummaries, allocations, hallFilter, lang, t, exam, shiftName, isBn }) {
  const halls = hallFilter ? hallSummaries.filter((h) => h.hall_number === hallFilter) : hallSummaries;
  return halls.map((h, idx) => {
    const hallAlloc = allocations.filter((a) => a.hall_number === h.hall_number);
    const perClassLines = formatHallClassBreakdown(hallAlloc, lang, isBn);
    const cols = (h.column_benches || []).map((benchCount, cIdx) => {
      let benchesHtml = '';
      let n = 0;
      for (let r = 1; r <= h.total_rows; r++) {
        for (let b = 1; b <= benchCount; b++) {
          n++;
          let seats = '';
          for (let s = 1; s <= h.seats_per_bench; s++) {
            const a = hallAlloc.find((x) => x.column_number === cIdx + 1 && x.row_number === r && x.bench_number === b && x.seat_index === s);
            seats += a
              ? `<div class="seat"><div>${t.cls}: <b>${fmtNum(a.student_class_snapshot, lang)}</b></div>
                  <div>${t.roll}: <b>${fmtNum(String(a.student_roll_snapshot).padStart(2, '0'), lang)}</b></div>
                  <div>${t.name}: <b>${a.student_name_snapshot}</b></div></div>`
              : `<div class="seat empty">—</div>`;
          }
          benchesHtml += `<div class="bench"><div class="bench-no">${t.bench} ${fmtNum(n, lang)}</div><div class="seats">${seats}</div></div>`;
        }
      }
      return `<div class="lcol"><div class="lcol-title">${t.bench} - ${t.col} - ${fmtNum(cIdx + 1, lang)}</div>${benchesHtml}</div>`;
    }).join('');

    return `
      <div class="layout-page ${idx > 0 ? 'page-break' : ''}">
        <div class="layout-top">
          <div class="hall-info">
            <div class="big">${t.hall}: ${h.hall_number}</div>
            <div class="class-breakdown">${perClassLines.map((line) => `<div>${line}</div>`).join('')}</div>
            <div class="total-line"><strong>${t.totalStudents}: ${fmtNum(hallAlloc.length, lang)}</strong></div>
          </div>
          <div style="flex:1"></div>
          <div class="shift-info">
            <div class="big">${shiftName}</div>
            <div>${exam.exam_time || ''}</div>
          </div>
          <div class="entry-box">${t.entry}</div>
        </div>
        <div class="lcols">${cols}</div>
      </div>`;
  }).join('');
}

function buildPrintableHtml({ exam, allocations, hallSummaries, settings, mode, hallFilter, lang, orientation }) {
  const isBn = lang === 'bn';
  const instName = isBn ? (settings.institutionNameBn || settings.institutionName) : settings.institutionName;
  const shiftName = isBn ? (exam.shift_name_bn || exam.shift_name) : exam.shift_name;
  const authTeacher = isBn ? (settings.authorizedTeacherNameBn || settings.authorizedTeacherName) : settings.authorizedTeacherName;

  const t = {
    hallWise: isBn ? 'হলভিত্তিক আসন বিন্যাস' : 'Hall-wise Seat Plan',
    complete: isBn ? 'সম্পূর্ণ আসন বিন্যাস' : 'Complete Seat Plan',
    studentWise: isBn ? 'শিক্ষার্থীভিত্তিক আসন বিন্যাস' : 'Student-wise Seat Plan',
    examDate: isBn ? 'পরীক্ষার তারিখ' : 'Exam Date',
    shift: isBn ? 'শিফট' : 'Shift',
    hall: isBn ? 'হল নম্বর' : 'Hall No.',
    col: isBn ? 'কলাম' : 'Col',
    row: isBn ? 'সারি' : 'Row',
    bench: isBn ? 'বেঞ্চ' : 'Bench',
    seat: isBn ? 'আসন' : 'Seat',
    roll: isBn ? 'রোল' : 'Roll',
    name: isBn ? 'শিক্ষার্থীর নাম' : 'Name',
    cls: isBn ? 'শ্রেণি' : 'Class',
    totalAllocated: isBn ? 'মোট বরাদ্দকৃত শিক্ষার্থী' : 'Total Allocated Students',
    totalStudents: isBn ? 'মোট শিক্ষার্থী' : 'Total Student',
    signature: isBn ? 'অনুমোদিত শিক্ষকের স্বাক্ষর' : 'Authorized Teacher Signature',
    generatedOn: isBn ? 'তৈরির সময়' : 'Generated on',
    layout: isBn ? 'রুম লেআউট' : 'Room Layout',
    entry: isBn ? 'প্রবেশপথ' : 'Entry'
  };

  const docTitle = mode === 'hall' ? t.hallWise : mode === 'student' ? t.studentWise : mode === 'layout' ? t.layout : t.complete;
  const targetHalls = mode === 'hall' && hallFilter ? hallSummaries.filter((h) => h.hall_number === hallFilter) : hallSummaries;

  let bodySections = '';

  if (mode === 'layout') {
    bodySections = buildLayoutSections({ hallSummaries, allocations, hallFilter, lang, t, exam, shiftName, isBn });
  } else if (mode === 'student') {
    const sorted = [...allocations].sort((a, b) =>
      a.student_class_snapshot !== b.student_class_snapshot
        ? a.student_class_snapshot - b.student_class_snapshot
        : a.student_roll_snapshot - b.student_roll_snapshot);
    bodySections = `
      <div class="summary-bar"><span><strong>${docTitle}</strong></span><span>${t.totalAllocated}: <strong>${fmtNum(sorted.length, lang)}</strong></span></div>
      <table>
        <thead><tr><th>#</th><th>${t.cls}</th><th>${t.roll}</th><th>${t.name}</th><th>${t.hall}</th><th>${t.col}</th><th>${t.row}</th><th>${t.bench}</th><th>${t.seat}</th></tr></thead>
        <tbody>
          ${sorted.map((item, idx) => `
            <tr>
              <td>${fmtNum(idx + 1, lang)}</td><td>${fmtNum(item.student_class_snapshot, lang)}</td>
              <td><strong>${fmtNum(item.student_roll_snapshot, lang)}</strong></td>
              <td class="text-left">${item.student_name_snapshot}</td><td>${item.hall_number}</td>
              <td>${fmtNum(item.column_number, lang)}</td><td>${fmtNum(item.row_number, lang)}</td>
              <td>${fmtNum(item.bench_number, lang)}</td><td>${seatLabel(item.seat_index - 1, item.seats_per_bench, lang)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } else {
    bodySections = targetHalls.map((h, idx) => {
      const hallAlloc = allocations.filter((a) => a.hall_number === h.hall_number);
      const colBreakdown = (h.column_benches || []).map((bCnt, cIdx) => `${t.col} ${fmtNum(cIdx + 1, lang)}: ${fmtNum(bCnt, lang)}`).join(', ');
      const perClassSummary = formatHallClassBreakdown(hallAlloc, lang, isBn).join(' | ');
      return `
        <div class="hall-block ${idx > 0 && mode === 'complete' ? 'page-break' : ''}">
          <div class="hall-header">
            <div>
              <strong>${t.hall}: ${h.hall_number}</strong>
              <span class="meta-muted"> (${colBreakdown} | ${t.seat}/${t.bench}: ${fmtNum(h.seats_per_bench, lang)})</span>
              <div class="hall-class-line">${perClassSummary}</div>
            </div>
            <div>${t.totalStudents}: <strong>${fmtNum(hallAlloc.length, lang)}</strong></div>
          </div>
          <table>
            <thead><tr><th>#</th><th>${t.col}</th><th>${t.row}</th><th>${t.bench}</th><th>${t.seat}</th><th>${t.cls}</th><th>${t.roll}</th><th>${t.name}</th></tr></thead>
            <tbody>
              ${hallAlloc.map((item, i) => `
                <tr>
                  <td>${fmtNum(i + 1, lang)}</td><td>${fmtNum(item.column_number, lang)}</td>
                  <td>${fmtNum(item.row_number, lang)}</td><td>${fmtNum(item.bench_number, lang)}</td>
                  <td>${seatLabel(item.seat_index - 1, item.seats_per_bench, lang)}</td>
                  <td>${fmtNum(item.student_class_snapshot, lang)}</td>
                  <td><strong>${fmtNum(item.student_roll_snapshot, lang)}</strong></td>
                  <td class="text-left">${item.student_name_snapshot}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }).join('');
  }

  const logoHtml = settings.institutionLogo
    ? `<img src="${settings.institutionLogo}" alt="Logo" class="logo" />`
    : `<div class="logo-placeholder">${instName.slice(0, 2).toUpperCase()}</div>`;

  return `<!DOCTYPE html>
<html lang="${isBn ? 'bn' : 'en'}">
<head>
<meta charset="UTF-8" />
<title>${docTitle} - ${exam.exam_name}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  @page { size: A4 ${orientation}; margin: 12mm 14mm; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
    margin: 0;
    padding: 16px;
    color: #0f172a;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .page-content { flex: 1 0 auto; }
  .doc-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1e293b; padding-bottom: 10px; margin-bottom: 14px; }
  .brand-left { display: flex; align-items: center; gap: 12px; }
  .logo { width: 52px; height: 52px; object-fit: contain; border-radius: 6px; border: 1px solid #cbd5e1; }
  .logo-placeholder { width: 52px; height: 52px; border-radius: 8px; background: #0f172a; color: #fff; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .inst-title { font-size: 18px; font-weight: 700; margin: 0; }
  .exam-title { font-size: 14px; font-weight: 600; color: #334155; margin: 2px 0 0; }
  .doc-badge { text-align: right; }
  .doc-type { font-size: 14px; font-weight: 700; color: #1d4ed8; }
  .meta-grid { display: flex; flex-wrap: wrap; gap: 16px; background: #f1f5f9; padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; font-size: 12px; }
  .hall-header { display: flex; justify-content: space-between; align-items: flex-start; background: #e2e8f0; padding: 7px 10px; border-left: 4px solid #1e293b; margin-top: 12px; margin-bottom: 6px; font-size: 12px; }
  .hall-class-line { margin-top: 3px; font-size: 11.5px; font-weight: 600; color: #1e293b; }
  .summary-bar { display: flex; justify-content: space-between; background: #eff6ff; border: 1px solid #bfdbfe; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; }
  .meta-muted { color: #475569; font-weight: 400; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  th, td { border: 1px solid #cbd5e1; padding: 5px 7px; text-align: center; font-size: 11.5px; }
  th { background: #1e293b; color: #fff; font-weight: 600; }
  tbody tr:nth-child(even) { background: #f8fafc; }
  .text-left { text-align: left; }
  .page-break { page-break-before: always; break-before: page; }
  .footer-sig {
    margin-top: auto;
    padding-top: 48px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
  }
  .sig-box {
    text-align: center;
    min-width: 210px;
    border-top: 1.5px solid #0f172a;
    padding-top: 6px;
    font-weight: 600;
    margin-left: auto;
  }
  .doc-footer { font-size: 10.5px; color: #64748b; }
  .layout-top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .big { font-size: 16px; font-weight: 700; }
  .hall-info, .shift-info { flex: 1; line-height: 1.55; }
  .class-breakdown { margin-top: 4px; font-size: 12.5px; font-weight: 600; color: #0f172a; }
  .total-line { margin-top: 4px; font-size: 13px; color: #1d4ed8; }
  .entry-box { flex: 0 0 90px; border: 2px solid #0f172a; border-radius: 0 28px 0 28px; padding: 12px 8px; text-align: center; font-weight: 700; }
  .lcols { display: flex; gap: 18px; align-items: flex-start; }
  .lcol { flex: 1; }
  .lcol-title { text-align: center; font-weight: 700; border-bottom: 2px solid #0f172a; padding-bottom: 4px; margin-bottom: 8px; }
  .bench { border: 1.5px solid #0f172a; margin-bottom: 10px; padding: 4px 6px; break-inside: avoid; page-break-inside: avoid; }
  .bench-no { font-size: 10px; color: #64748b; margin-bottom: 2px; }
  .seats { display: flex; gap: 8px; }
  .seat { flex: 1; font-size: 11px; line-height: 1.5; padding: 2px 4px; }
  .seat + .seat { border-left: 1px dashed #94a3b8; }
  .seat.empty { color: #94a3b8; text-align: center; align-self: center; }
  @media print {
    body { padding: 0; min-height: auto; }
    .footer-sig { padding-top: 28px; }
  }
</style>
</head>
<body>
  <div class="page-content">
    <div class="doc-header">
      <div class="brand-left">
        ${logoHtml}
        <div><h1 class="inst-title">${instName}</h1><div class="exam-title">${exam.exam_name}</div></div>
      </div>
      <div class="doc-badge">
        <div class="doc-type">${docTitle}</div>
        <div>${t.totalAllocated}: <strong>${fmtNum(allocations.length, lang)}</strong></div>
      </div>
    </div>
    <div class="meta-grid">
      <div><strong>${t.examDate}:</strong> ${exam.exam_date}</div>
      <div><strong>${t.shift}:</strong> ${shiftName}</div>
      ${exam.exam_time ? `<div><strong>${isBn ? 'সময়' : 'Time'}:</strong> ${exam.exam_time}</div>` : ''}
      <div><strong>${t.totalAllocated}:</strong> ${fmtNum(allocations.length, lang)}</div>
    </div>
    ${bodySections}
  </div>

  <div class="footer-sig">
    <div class="doc-footer"><span>${t.generatedOn}: ${new Date().toLocaleDateString()}</span></div>
    <div class="sig-box">
      <div>${authTeacher}</div>
      <div style="font-size:10.5px; color:#475569; font-weight:400;">${t.signature}</div>
    </div>
  </div>
</body>
</html>`;
}

function openPrintPdfWindow(htmlStr) {
  const win = window.open('', '_blank', 'width=960,height=720');
  if (!win) { alert('Please allow pop-ups in your browser to open and save/print the PDF.'); return; }
  win.document.open();
  win.document.write(htmlStr);
  win.document.close();
  win.focus();
  setTimeout(() => { win.print(); }, 450);
}

function loadLS(key, fallback) {
  try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : fallback; } catch { return fallback; }
}

function App() {
  const [activeTab, setActiveTab] = useState('students');
  const [students, setStudents] = useState(() => loadLS(STORAGE_KEYS.STUDENTS, INITIAL_STUDENTS));
  const [examinations, setExaminations] = useState(() => loadLS(STORAGE_KEYS.EXAMS, []));
  const [settings, setSettings] = useState(() => ({ ...INITIAL_SETTINGS, ...loadLS(STORAGE_KEYS.SETTINGS, {}) }));

  useEffect(() => { localStorage.setItem(STORAGE_KEYS.STUDENTS, JSON.stringify(students)); }, [students]);
  useEffect(() => { localStorage.setItem(STORAGE_KEYS.EXAMS, JSON.stringify(examinations)); }, [examinations]);
  useEffect(() => { localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(settings)); }, [settings]);

  const [searchQuery, setSearchQuery] = useState('');
  const [classFilter, setClassFilter] = useState('ALL');
  const [sortRollAsc, setSortRollAsc] = useState(true);
  const [stuForm, setStuForm] = useState({ id: null, name: '', roll: '', class: 1 });
  const [stuError, setStuError] = useState('');
  const [importReport, setImportReport] = useState(null);

  const [examMeta, setExamMeta] = useState({
    exam_name: 'Half-Yearly Examination 2026',
    exam_date: new Date().toISOString().slice(0, 10),
    shift_name: 'Morning Shift',
    shift_name_bn: 'সকালের শিফট',
    exam_time: '8:00 - 11:00',
    pattern: 'z_serial'
  });
  const [selectedClasses, setSelectedClasses] = useState([1, 2, 3, 4, 5]);
  const [excludedIds, setExcludedIds] = useState([]);
  const [hallsConfig, setHallsConfig] = useState([
    {
      id: 'h-1',
      hall_number: 'Hall 101',
      total_rows: 1,
      column_count: 2,
      column_benches: [4, 4],
      seats_per_bench: 2,
      assigned_classes: [1, 5],
      fallback_classes: [2, 3, 4],
      middle_classes: [],
      middle_class: '',
      middle_fallback_class: ''
    },
    {
      id: 'h-2',
      hall_number: 'Hall 102',
      total_rows: 1,
      column_count: 2,
      column_benches: [4, 4],
      seats_per_bench: 2,
      assigned_classes: [2, 4],
      fallback_classes: [1, 3, 5],
      middle_classes: [],
      middle_class: '',
      middle_fallback_class: ''
    }
  ]);
  const [generatedPlan, setGeneratedPlan] = useState(null);
  const [previewState, setPreviewState] = useState({
    open: false, exam: null, allocations: [], hallSummaries: [], mode: 'complete', hallFilter: '', lang: 'en', orientation: 'portrait'
  });

  const [historySearch, setHistorySearch] = useState('');
  const [historyDate, setHistoryDate] = useState('');
  const [selectedHistoryExam, setSelectedHistoryExam] = useState(null);

  const classCounts = useMemo(() => {
    const counts = {};
    CLASSES.forEach((c) => (counts[c] = 0));
    students.forEach((s) => { const c = Number(s.class); if (counts[c] !== undefined) counts[c] += 1; });
    return counts;
  }, [students]);

  const filteredStudents = useMemo(() => {
    return students
      .filter((s) => {
        if (classFilter !== 'ALL' && Number(s.class) !== Number(classFilter)) return false;
        if (!searchQuery.trim()) return true;
        const q = searchQuery.toLowerCase();
        return String(s.name).toLowerCase().includes(q) || String(s.roll).toLowerCase().includes(q);
      })
      .sort((a, b) => {
        if (classFilter === 'ALL' && Number(a.class) !== Number(b.class)) return Number(a.class) - Number(b.class);
        return sortRollAsc ? Number(a.roll) - Number(b.roll) : Number(b.roll) - Number(a.roll);
      });
  }, [students, searchQuery, classFilter, sortRollAsc]);

  const handleSaveStudent = (e) => {
    e.preventDefault();
    setStuError('');
    const cleanName = stuForm.name.trim();
    const rollNum = Number(stuForm.roll);
    const clsNum = Number(stuForm.class);
    if (!cleanName) { setStuError('Student Name is required.'); return; }
    if (!Number.isInteger(rollNum) || rollNum <= 0) { setStuError('Roll Number must be a positive integer.'); return; }
    if (!Number.isInteger(clsNum) || clsNum < 1 || clsNum > 10) { setStuError('Class must be between 1 and 10.'); return; }
    const duplicate = students.find((s) => Number(s.class) === clsNum && Number(s.roll) === rollNum && s.id !== stuForm.id);
    if (duplicate) { setStuError(`Duplicate Roll ${rollNum} in Class ${clsNum} (${duplicate.name}).`); return; }

    const now = new Date().toISOString();
    if (stuForm.id) {
      setStudents((prev) => prev.map((s) => (s.id === stuForm.id ? { ...s, name: cleanName, roll: rollNum, class: clsNum, updated_at: now } : s)));
    } else {
      setStudents((prev) => [...prev, {
        id: `stu-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
        name: cleanName, roll: rollNum, class: clsNum, created_at: now, updated_at: now
      }]);
    }
    setStuForm({ id: null, name: '', roll: '', class: clsNum });
  };

  const handleDeleteStudent = (student) => {
    if (window.confirm(`Delete "${student.name}" (Class ${student.class}, Roll ${student.roll})?`)) {
      setStudents((prev) => prev.filter((s) => s.id !== student.id));
      if (stuForm.id === student.id) setStuForm({ id: null, name: '', roll: '', class: 1 });
    }
  };

  const handleDownloadTemplate = () => {
    if (!window.XLSX) { alert('Excel library is still loading. Please try again in a moment.'); return; }
    const ws = window.XLSX.utils.aoa_to_sheet([['Name', 'Roll', 'Class'], ['Sample Student One', 1, 1], ['Sample Student Two', 2, 1]]);
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, 'StudentsTemplate');
    window.XLSX.writeFile(wb, 'student_import_template.xlsx');
  };

  const handleFileUpload = (e) => {
    const file = e.target.files?.[0];
    e.target.value = '';
    if (!file || !window.XLSX) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = window.XLSX.read(data, { type: 'array' });
        const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
        let addedCount = 0;
        const errors = [];
        const workingList = [...students];
        const now = new Date().toISOString();

        rows.forEach((row, index) => {
          const rowNum = index + 2;
          const rawName = String(row.Name ?? row.name ?? '').trim();
          const rawRoll = row.Roll ?? row.roll ?? '';
          const rawClass = row.Class ?? row.class ?? '';
          if (!rawName || rawRoll === '' || rawClass === '') { errors.push(`Row ${rowNum}: Missing required field (Name, Roll, or Class).`); return; }
          const rollNum = Number(rawRoll);
          const clsNum = Number(rawClass);
          if (!Number.isInteger(rollNum) || rollNum <= 0) { errors.push(`Row ${rowNum} (${rawName}): Invalid Roll "${rawRoll}".`); return; }
          if (!Number.isInteger(clsNum) || clsNum < 1 || clsNum > 10) { errors.push(`Row ${rowNum} (${rawName}): Invalid Class "${rawClass}" (must be 1–10).`); return; }
          if (workingList.some((s) => Number(s.class) === clsNum && Number(s.roll) === rollNum)) {
            errors.push(`Row ${rowNum} (${rawName}): Duplicate Roll ${rollNum} in Class ${clsNum}.`); return;
          }
          workingList.push({
            id: `stu-${Date.now()}-${rowNum}-${Math.random().toString(36).slice(2, 5)}`,
            name: rawName, roll: rollNum, class: clsNum, created_at: now, updated_at: now
          });
          addedCount += 1;
        });

        setStudents(workingList);
        setImportReport({ fileName: file.name, totalRows: rows.length, addedCount, errors });
      } catch (err) {
        setImportReport({ fileName: file.name, totalRows: 0, addedCount: 0, errors: [`Failed to parse file: ${err.message}`] });
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const toggleClassSelection = (cls) => {
    setSelectedClasses((prev) => (prev.includes(cls) ? prev.filter((c) => c !== cls) : [...prev, cls].sort((a, b) => a - b)));
    setGeneratedPlan(null);
  };
  const toggleExcludeStudent = (id) => {
    setExcludedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
    setGeneratedPlan(null);
  };

  const fetchedStudents = useMemo(() => {
    return students
      .filter((s) => selectedClasses.includes(Number(s.class)))
      .sort((a, b) => (Number(a.class) !== Number(b.class) ? Number(a.class) - Number(b.class) : Number(a.roll) - Number(b.roll)));
  }, [students, selectedClasses]);

  const activeSelectedStudents = useMemo(() => fetchedStudents.filter((s) => !excludedIds.includes(s.id)), [fetchedStudents, excludedIds]);

  const addHall = () => {
    setHallsConfig((prev) => [...prev, {
      id: `h-${Date.now()}`,
      hall_number: `Hall ${101 + prev.length}`,
      total_rows: 1,
      column_count: 2,
      column_benches: [4, 4],
      seats_per_bench: 2,
      assigned_classes: [...selectedClasses],
      fallback_classes: [],
      middle_classes: [],
      middle_class: '',
      middle_fallback_class: ''
    }]);
    setGeneratedPlan(null);
  };
  const removeHall = (idx) => {
    if (hallsConfig.length <= 1) return;
    setHallsConfig((prev) => prev.filter((_, i) => i !== idx));
    setGeneratedPlan(null);
  };
  const updateHallField = (idx, field, value) => {
    setHallsConfig((prev) => prev.map((h, i) => {
      if (i !== idx) return h;
      if (field === 'column_count') {
        if (value === '') {
          return { ...h, column_count: '' };
        }
        const parsed = parseInt(value, 10);
        if (isNaN(parsed)) {
          return { ...h, column_count: '' };
        }
        const n = Math.min(10, Math.max(1, parsed));
        const nextBenches = [];
        for (let c = 0; c < n; c++) nextBenches.push(h.column_benches?.[c] ?? 4);
        return { ...h, column_count: n, column_benches: nextBenches };
      }
      return { ...h, [field]: value };
    }));
    setGeneratedPlan(null);
  };
  const toggleHallClass = (hallIdx, fieldName, cls) => {
    setHallsConfig((prev) => prev.map((h, i) => {
      if (i !== hallIdx) return h;
      const cur = Array.isArray(h[fieldName]) ? h[fieldName] : [];
      const next = cur.includes(cls) ? cur.filter((x) => x !== cls) : [...cur, cls].sort((a, b) => a - b);
      return { ...h, [fieldName]: next };
    }));
    setGeneratedPlan(null);
  };
  const updateColumnBenchCount = (hallIdx, colIdx, val) => {
    setHallsConfig((prev) => prev.map((h, i) => {
      if (i !== hallIdx) return h;
      const next = [...(h.column_benches || [])];
      if (val === '') {
        next[colIdx] = '';
      } else {
        const parsed = parseInt(val, 10);
        next[colIdx] = isNaN(parsed) ? '' : Math.max(1, Math.min(100, parsed));
      }
      return { ...h, column_benches: next };
    }));
    setGeneratedPlan(null);
  };

  const handleGeneratePlan = () => {
    if (!examMeta.exam_name.trim()) { alert('Please enter an Examination Name.'); return; }
    if (activeSelectedStudents.length === 0) { alert('Please select at least one class with active students.'); return; }
    setGeneratedPlan(allocateSeats(activeSelectedStudents, hallsConfig, examMeta.pattern));
  };

  const handleFinalizePlan = () => {
    if (!generatedPlan || generatedPlan.allocations.length === 0) return;
    const now = new Date().toISOString();
    const finalizedExam = {
      id: `exam-${Date.now()}`,
      institution_name: settings.institutionName,
      institution_name_bn: settings.institutionNameBn,
      exam_name: examMeta.exam_name.trim(),
      exam_date: examMeta.exam_date,
      shift_name: examMeta.shift_name,
      shift_name_bn: examMeta.shift_name_bn,
      exam_time: examMeta.exam_time,
      pattern: examMeta.pattern,
      status: 'FINALIZED',
      created_at: now,
      finalized_at: now,
      halls: generatedPlan.hallSummaries,
      allocations: generatedPlan.allocations
    };
    setExaminations((prev) => [finalizedExam, ...prev]);
    setSelectedHistoryExam(finalizedExam);
    setActiveTab('history');
  };

  const openPreviewModal = (examObj, hallSummariesObj, allocationsObj, mode = 'complete', hallFilter = '') => {
    setPreviewState({
      open: true, exam: examObj, hallSummaries: hallSummariesObj, allocations: allocationsObj, mode,
      hallFilter: hallFilter || (hallSummariesObj[0]?.hall_number || ''),
      lang: 'en',
      orientation: mode === 'layout' ? 'landscape' : 'portrait'
    });
  };

  const filteredHistory = useMemo(() => {
    return examinations.filter((ex) => {
      if (historyDate && ex.exam_date !== historyDate) return false;
      if (historySearch.trim() && !ex.exam_name.toLowerCase().includes(historySearch.toLowerCase())) return false;
      return true;
    });
  }, [examinations, historySearch, historyDate]);

  const currentPreviewHtml = useMemo(() => {
    if (!previewState.open || !previewState.exam) return '';
    return buildPrintableHtml({
      exam: previewState.exam, allocations: previewState.allocations, hallSummaries: previewState.hallSummaries,
      settings, mode: previewState.mode, hallFilter: previewState.hallFilter, lang: previewState.lang, orientation: previewState.orientation
    });
  }, [previewState, settings]);

  const tabBtn = (id, label) => (
    <button onClick={() => setActiveTab(id)}
      className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition ${activeTab === id ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-200 hover:bg-slate-700'}`}>
      {label}
    </button>
  );

  const modeBtn = (mode, label, extra = {}) => (
    <button type="button" onClick={() => setPreviewState((p) => ({ ...p, mode, ...extra }))}
      className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${previewState.mode === mode ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-200'}`}>
      {label}
    </button>
  );

  const allocTable = (rows, nameHead) => (
    <table className="w-full text-xs border-collapse">
      <thead>
        <tr className="bg-slate-100 text-slate-700 text-left">
          {['Hall', 'Col', 'Row', 'Bench', 'Seat', 'Class', 'Roll', nameHead].map((h) => <th key={h} className="p-2 border">{h}</th>)}
        </tr>
      </thead>
      <tbody>
        {rows.map((a) => (
          <tr key={a.id} className="hover:bg-slate-50">
            <td className="p-2 border font-semibold">{a.hall_number}</td>
            <td className="p-2 border">{a.column_number}</td>
            <td className="p-2 border">{a.row_number}</td>
            <td className="p-2 border">{a.bench_number}</td>
            <td className="p-2 border">{seatLabel(a.seat_index - 1, a.seats_per_bench, 'en')}</td>
            <td className="p-2 border">Class {a.student_class_snapshot}</td>
            <td className="p-2 border font-bold text-blue-700">{a.student_roll_snapshot}</td>
            <td className="p-2 border font-bangla">{a.student_name_snapshot}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );

  return (
    <div className="min-h-screen flex flex-col">
      <header className="bg-slate-900 text-white shadow-md sticky top-0 z-30 no-print">
        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            {settings.institutionLogo ? (
              <img src={settings.institutionLogo} alt="Logo" className="w-10 h-10 rounded-lg object-cover bg-white" />
            ) : (
              <div className="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-lg">SP</div>
            )}
            <div>
              <h1 className="font-bold text-base sm:text-lg leading-tight">Student Database & Seat Plan System</h1>
              <p className="text-xs text-slate-300 font-bangla">{settings.institutionName} • {settings.institutionNameBn}</p>
            </div>
          </div>
          <nav className="flex items-center gap-1.5 sm:gap-2">
            {tabBtn('students', `Student Database (${students.length})`)}
            {tabBtn('generator', 'Create Seat Plan')}
            {tabBtn('history', `Exam History (${examinations.length})`)}
            {tabBtn('settings', 'Settings')}
          </nav>
        </div>
      </header>

      <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        {activeTab === 'students' && (
          <div className="space-y-6">
            <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                <div>
                  <h2 className="text-lg font-bold text-slate-800">Student Management</h2>
                  <p className="text-xs text-slate-500">Permanent storage active • Total Students: <strong>{students.length}</strong></p>
                </div>
                <div className="flex flex-wrap items-center gap-2">

              <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <h3 className="font-bold text-slate-800">Snapshot Allocations: {selectedHistoryExam.exam_name} ({selectedHistoryExam.exam_date})</h3>
                  <button type="button" onClick={() => setSelectedHistoryExam(null)} className="text-xs text-slate-500 hover:text-slate-800">Close</button>
                </div>
                <div className="overflow-x-auto max-h-80">{allocTable(selectedHistoryExam.allocations || [], 'Student Name (Snapshot)')}</div>
              </div>
            )}
          </div>
        )}

        {activeTab === 'settings' && (
          <div className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm max-w-2xl space-y-4">
            <h2 className="text-lg font-bold text-slate-800">Institution & PDF Settings</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className={LBL}>Institution Name (English)</label>
                <input type="text" value={settings.institutionName} onChange={(e) => setSettings({ ...settings, institutionName: e.target.value })} className={INP} />
              </div>
              <div>
                <label className={LBL}>প্রতিষ্ঠানের নাম (বাংলা)</label>
                <input type="text" value={settings.institutionNameBn} onChange={(e) => setSettings({ ...settings, institutionNameBn: e.target.value })} className={INP + ' font-bangla'} />
              </div>
              <div>
                <label className={LBL}>Authorized Teacher (English)</label>
                <input type="text" value={settings.authorizedTeacherName} onChange={(e) => setSettings({ ...settings, authorizedTeacherName: e.target.value })} className={INP} />
              </div>
              <div>
                <label className={LBL}>অনুমোদিত শিক্ষক (বাংলা)</label>
                <input type="text" value={settings.authorizedTeacherNameBn} onChange={(e) => setSettings({ ...settings, authorizedTeacherNameBn: e.target.value })} className={INP + ' font-bangla'} />
              </div>
            </div>
            <div>
              <label className={LBL}>Institution Logo</label>
              <input type="file" accept="image/*" className="text-xs" onChange={(e) => {
                const f = e.target.files?.[0];
                if (!f) return;
                const r = new FileReader();
                r.onload = () => setSettings((prev) => ({ ...prev, institutionLogo: String(r.result) }));
                r.readAsDataURL(f);
              }} />
            </div>
          </div>
        )}
      </main>

      {previewState.open && (
        <div className="fixed inset-0 z-50 bg-slate-950/70 flex items-center justify-center p-3 sm:p-6">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[92vh] flex flex-col overflow-hidden">
            <div className="px-5 py-3.5 bg-slate-900 text-white flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-2">
                {modeBtn('hall', 'A. Hall-wise')}
                {modeBtn('complete', 'B. Complete')}
                {modeBtn('student', 'C. Student-wise')}
                {modeBtn('layout', 'D. Room Layout', { orientation: 'landscape' })}
                {(previewState.mode === 'hall' || previewState.mode === 'layout') && (
                  <select value={previewState.hallFilter} onChange={(e) => setPreviewState((p) => ({ ...p, hallFilter: e.target.value }))}
                    className="px-2.5 py-1.5 rounded-lg bg-slate-800 text-white text-xs border border-slate-700">
                    <option value="">All Halls</option>
                    {previewState.hallSummaries.map((h) => <option key={h.hall_number} value={h.hall_number}>{h.hall_number}</option>)}
                  </select>
                )}
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <button type="button" onClick={() => setPreviewState((p) => ({ ...p, orientation: p.orientation === 'portrait' ? 'landscape' : 'portrait' }))}
                  className="px-2.5 py-1.5 rounded-lg bg-slate-800 text-xs font-semibold hover:bg-slate-700">
                  {previewState.orientation === 'portrait' ? 'A4 Portrait' : 'A4 Landscape'}
                </button>
                <button type="button" onClick={() => setPreviewState((p) => ({ ...p, lang: p.lang === 'en' ? 'bn' : 'en' }))}
                  className="px-2.5 py-1.5 rounded-lg bg-slate-800 text-xs font-semibold hover:bg-slate-700 font-bangla">
                  {previewState.lang === 'en' ? 'English / বাংলা' : 'বাংলা / English'}
                </button>
                <button type="button" onClick={() => openPrintPdfWindow(currentPreviewHtml)}
                  className="px-3.5 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700">Download / Print PDF</button>
                <button type="button" onClick={() => setPreviewState((p) => ({ ...p, open: false }))}
                  className="px-2.5 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-semibold hover:bg-rose-700">Close</button>
              </div>
            </div>
            <div className="flex-1 bg-slate-200 p-3 overflow-auto">
              <iframe title="PDF Preview" srcDoc={currentPreviewHtml} className="w-full h-[72vh] bg-white rounded-lg border border-slate-300" />
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
  </html>
